<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chitra – Print Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Chewy&family=Fredoka:wght@400;500;600;700&family=Lobster&family=Pacifico&family=Permanent+Marker&family=Righteous&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">CHITRA<span>✦</span></div>

  <select id="sizePreset" title="Pick what you're printing">
    <optgroup label="👕 DTF T-shirt transfers (300 DPI)">
      <option value="3300x3900" data-guide="shirt">T-shirt front · 11×13 in</option>
      <option value="3600x4800" data-guide="shirt">T-shirt back · 12×16 in</option>
      <option value="2400x3000" data-guide="shirt">Kids tee · 8×10 in</option>
      <option value="1200x1200" data-guide="none">Left chest · 4×4 in</option>
    </optgroup>
    <optgroup label="🧻 DTF gang sheets (22 in roll)">
      <option value="6600x3600" data-guide="none">Gang sheet · 22×12 in</option>
      <option value="6600x7200" data-guide="none">Gang sheet · 22×24 in</option>
    </optgroup>
    <optgroup label="☕ Sublimation (300 DPI)">
      <option value="2475x1050" data-guide="mug">11 oz mug wrap · 8.25×3.5 in</option>
      <option value="2700x1125" data-guide="mug">15 oz mug wrap · 9×3.75 in</option>
      <option value="2790x2460" data-guide="none">20 oz tumbler wrap · 9.3×8.2 in</option>
      <option value="1200x1200" data-guide="none">Coaster · 4×4 in</option>
      <option value="2850x2370" data-guide="none">Mouse pad · 9.5×7.9 in</option>
    </optgroup>
    <optgroup label="📱 Social">
      <option value="1080x1080" data-guide="none">Instagram post · 1080×1080</option>
      <option value="1080x1920" data-guide="none">Story · 1080×1920</option>
    </optgroup>
  </select>
  <button id="customSize" title="Enter your own size in inches">📐 Custom</button>
  <span class="chip" id="sizeInfo"></span>

  <span class="spacer"></span>
  <button id="undo" title="Undo (Ctrl+Z)">↶</button>
  <button id="redo" title="Redo (Ctrl+Y)">↷</button>
  <button id="zoomOut" title="Zoom out">−</button>
  <span class="chip" id="zoomLabel">100%</span>
  <button id="zoomIn" title="Zoom in">+</button>
  <button id="zoomFit" title="Fit to screen">Fit</button>
  <button id="saveProject" title="Save project">💾</button>
  <label class="btn" for="openProject" title="Open project">📂</label>
  <input type="file" id="openProject" accept=".json" hidden>
  <label class="check" title="Flips the file left-to-right. Turn on for sublimation transfers (not for DTF)."><input type="checkbox" id="mirror"> Mirror</label>
  <select id="exportFormat"><option value="png">PNG</option><option value="jpeg">JPG</option></select>
  <button id="download" class="primary">⬇ Download</button>
</header>

<div class="layout">
  <nav class="sidebar">
    <section class="card">
      <h3>Print tools</h3>
      <label class="check"><input type="checkbox" id="transparent" checked> Transparent background</label>
      <label class="row">Colour <input type="color" id="bgColor" value="#ffffff" disabled></label>
      <label class="check"><input type="checkbox" id="showGuides" checked> Show print guides</label>
      <button id="pack" class="wide">🧩 Pack onto sheet</button>
      <button id="copies" class="wide">📑 Make copies…</button>
    </section>

    <section class="card">
      <h3>Text</h3>
      <button data-text="heading" class="wide big">Add a heading</button>
      <div class="grid">
        <button data-tstyle="pop" class="ts-pop">POP!</button>
        <button data-tstyle="retro" class="ts-retro">Retro</button>
        <button data-tstyle="neon" class="ts-neon">Neon</button>
        <button data-tstyle="stamp" class="ts-stamp">STAMP</button>
      </div>
      <button data-text="sub" class="wide">Add a subheading</button>
      <button data-text="body" class="wide small">Add body text</button>
    </section>

    <section class="card">
      <h3>Shapes</h3>
      <div class="grid">
        <button data-add="rect">▭ Box</button>
        <button data-add="circle">◯ Circle</button>
        <button data-add="triangle">△ Triangle</button>
        <button data-add="line">╱ Line</button>
        <button data-add="star">★ Star</button>
        <button data-add="heart">♥ Heart</button>
      </div>
    </section>

    <section class="card">
      <h3>Stickers</h3>
      <div class="emoji-grid" id="emojiGrid"></div>
    </section>

    <section class="card">
      <h3>Your art</h3>
      <label class="btn wide big-upload" for="imgUpload">＋ Upload image</label>
      <input type="file" id="imgUpload" accept="image/*" multiple hidden>
      <p class="tip">Drag &amp; drop or paste works too.</p>
    </section>

    <section class="card">
      <h3>Quick starts</h3>
      <div class="grid">
        <button data-template="slogan">Good Vibes</button>
        <button data-template="badge">Badge</button>
        <button data-template="mug">Mug Quote</button>
        <button data-template="blank">Blank</button>
      </div>
    </section>
  </nav>

  <main class="stage" id="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="c"></canvas>
      <div class="guides" id="guides"></div>
    </div>
  </main>

  <aside class="props" id="props">
    <div id="emptyProps" class="hint">
      <div class="hint-emoji">🎨</div>
      <b>Click anything on the canvas</b> to style it.<br><br>
      <small>Del – delete<br>Ctrl+D – duplicate<br>Ctrl+Z / Y – undo / redo<br>Arrows – nudge (Shift = 10×)</small>
    </div>
    <div id="propsBody" hidden>
      <section class="card">
        <h3>Colour</h3>
        <div class="swatches" id="swatches"></div>
        <label class="row">Fill <input type="color" id="fill"></label>
        <label class="row">Outline <input type="color" id="stroke"></label>
        <label class="row">Outline size <input type="range" id="strokeWidth" min="0" max="80" value="0"></label>
        <label class="row">Opacity <input type="range" id="opacity" min="0" max="100" value="100"></label>
        <label class="row">Rotate <input type="range" id="angle" min="0" max="360" value="0"></label>
        <label class="check"><input type="checkbox" id="shadow"> Drop shadow</label>
      </section>

      <section class="card" id="textSec" hidden>
        <h3>Text</h3>
        <select id="fontFamily"></select>
        <label class="row">Size <input type="number" id="fontSize" min="6" max="2000" value="48"></label>
        <div class="grid3">
          <button id="bold"><b>B</b></button>
          <button id="italic"><i>I</i></button>
          <button id="underline"><u>U</u></button>
          <button data-talign="left">⯇</button>
          <button data-talign="center">≡</button>
          <button data-talign="right">⯈</button>
        </div>
        <label class="row">Line height <input type="range" id="lineHeight" min="70" max="250" value="116"></label>
        <label class="row">Spacing <input type="range" id="charSpacing" min="-100" max="800" value="0"></label>
      </section>

      <section class="card" id="imageSec" hidden>
        <h3>Photo fixes</h3>
        <div class="dpi" id="dpiInfo"></div>
        <label class="row" title="Knocks out white/near-white background — great for DTF">Remove white <input type="range" data-filter="whiteDist" min="0" max="100" value="0"></label>
        <label class="row">Brightness <input type="range" data-filter="brightness" min="-100" max="100" value="0"></label>
        <label class="row">Contrast <input type="range" data-filter="contrast" min="-100" max="100" value="0"></label>
        <label class="row">Saturation <input type="range" data-filter="saturation" min="-100" max="100" value="0"></label>
        <label class="row">Blur <input type="range" data-filter="blur" min="0" max="100" value="0"></label>
        <div class="grid3">
          <button data-preset="grayscale">B&amp;W</button>
          <button data-preset="sepia">Sepia</button>
          <button data-preset="invert">Invert</button>
          <button data-preset="vintage">Vintage</button>
          <button data-preset="reset">Reset</button>
          <button id="cropToCanvas">Fill</button>
        </div>
      </section>

      <section class="card">
        <h3>Arrange</h3>
        <div class="grid3">
          <button id="forward">Up</button>
          <button id="backward">Down</button>
          <button id="toFront">Front</button>
          <button id="toBack">Back</button>
          <button id="flipH">Flip ↔</button>
          <button id="flipV">Flip ↕</button>
        </div>
        <div class="grid3">
          <button data-align="left">⇤</button>
          <button data-align="center">↔</button>
          <button data-align="right">⇥</button>
          <button data-align="top">⇡</button>
          <button data-align="middle">↕</button>
          <button data-align="bottom">⇣</button>
        </div>
        <div class="grid3">
          <button id="duplicate">Copy</button>
          <button id="lock">Lock</button>
          <button id="delete" class="danger">Delete</button>
        </div>
      </section>
    </div>
  </aside>
</div>

<script src="vendor/fabric.min.js"></script>
<script src="app.js"></script>
</body>
</html>
